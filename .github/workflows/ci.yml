name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore BankingMicroservices.sln

      - name: Build solution
        run: dotnet build BankingMicroservices.sln -c Release --no-restore

      - name: Check Docker
        run: docker info

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run tests with coverage
        run: dotnet test BankingMicroservices.sln -c Release --no-build --no-restore --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults -m:1

      - name: Generate coverage report
        if: always()
        shell: bash
        run: |
          if find TestResults -name 'coverage.cobertura.xml' -print -quit | grep -q .; then
            dotnet tool run reportgenerator \
              '-reports:TestResults/**/coverage.cobertura.xml' \
              '-targetdir:coverage-report' \
              '-reporttypes:Html;TextSummary;Cobertura' \
              '-assemblyfilters:+Clients.*;+Accounts.*;-*.Tests'
          else
            echo "No coverage files were generated."
          fi

      - name: Print coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage-report/Summary.txt ]; then
            cat coverage-report/Summary.txt
          else
            echo "Coverage summary is not available."
          fi

      - name: Upload test and coverage results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-and-coverage-results
          path: |
            TestResults
            coverage-report
          if-no-files-found: warn
